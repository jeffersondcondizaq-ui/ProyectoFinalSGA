<mat-toolbar class="toolbar">
  <button matIconButton aria-label="Mostrar menú" (click)="opened.set(!opened())">
    <mat-icon>menu</mat-icon>
  </button>
  <span>SGA · Aparta-Suites UQ</span>
  <span class="espacio"></span>
  @if (sesion.sesion(); as s) {
    <span class="usuario">{{ s.nombre }} · {{ s.rol }}</span>
    <button matIconButton aria-label="Cerrar sesión" (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<div class="barra-carga">
  @if (carga.cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }
</div>

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" [opened]="opened()">
    <mat-nav-list>
      @for (opcion of menu(); track opcion.ruta) {
        <a
          mat-list-item
          [routerLink]="opcion.ruta"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
        >
          <mat-icon matListItemIcon>{{ opcion.icono }}</mat-icon>
          <span matListItemTitle>{{ opcion.etiqueta }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
