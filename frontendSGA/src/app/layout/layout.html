<mat-toolbar class="toolbar">
  <button matIconButton aria-label="Mostrar menú" (click)="opened.set(!opened())">
    <mat-icon>menu</mat-icon>
  </button>
  <span>SGA</span>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" [opened]="opened()">
    <mat-nav-list>
      <a mat-list-item routerLink="/inicio" routerLinkActive #rla="routerLinkActive" [activated]="rla.isActive">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Inicio</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
