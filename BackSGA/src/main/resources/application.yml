server:
  port: 8080

spring:
  application:
    name: sga-backend

  datasource:
    url: jdbc:h2:file:./data/sga        # en memoria: jdbc:h2:mem:sga
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: America/Bogota

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: http://localhost:4200